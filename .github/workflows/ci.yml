name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests plus the recall test, which replays recorded Gemini responses (no live calls, no secrets).
      # DB ownership tests run only with RUN_DB_TESTS=1 (npm run test:db).
      - run: npm test
        env:
          CI: 'true'
